[project]
name = "keyboard-adapter"
version = "0.1.0"
description = "Клавіатура замість джойстика: MANUAL_CONTROL у SITL ArduPlane"
requires-python = ">=3.11"
dependencies = [
    "pymavlink>=2.4.41",
    "pynput>=1.7.7",
]

[project.scripts]
keyboard-adapter = "keyboard_adapter.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keyboard_adapter"]

[tool.pytest.ini_options]
testpaths = ["tests"]

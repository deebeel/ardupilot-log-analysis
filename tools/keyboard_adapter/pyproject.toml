[project]
name = "keyboard-adapter"
version = "0.1.0"
description = "Клавіатура замість джойстика: MANUAL_CONTROL у SITL ArduPlane"
requires-python = ">=3.11"
dependencies = [
    "pymavlink>=2.4.41",
    # Лінукс-специфічний C-розширення пакет (ioctl до /dev/input) — на macOS не
    # збирається (стенд там і не запускається — README.mac.md). Маркер платформи
    # не дає `uv sync` намагатись його ставити поза Linux.
    "evdev>=1.7; sys_platform == 'linux'",
]

[project.scripts]
keyboard-adapter = "keyboard_adapter.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keyboard_adapter"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src/keyboard_adapter", "tests"]
mypy_path = ["src", "tests"]

# pymavlink і evdev не постачають type stubs — точково, не глобально
[[tool.mypy.overrides]]
module = ["pymavlink.*", "evdev.*"]
ignore_missing_imports = true

[project]
name = "parser"
version = "0.1.0"
description = "ArduPlane flight log parser: DataFlash .bin -> deterministic piloting-quality metrics JSON"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymavlink>=2.4.42",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "watchdog>=4.0",
]

[project.scripts]
parser-watcher = "parser.watcher:main"
parser-worker = "parser.worker:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

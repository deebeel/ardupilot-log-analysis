# Спільний для локального прогону і VPS — різниця лише в .env (DOMAIN, TAG, DATA_DIR).
# Образи на VPS не білдяться і не пушаться в registry (deploy.sh: docker save|gzip →
# scp → docker load) — тут лише `image:`, ніколи `build:`.
services:
  parser:
    image: ardupilot-la/parser:${TAG:-local}
    volumes:
      - ${DATA_DIR:-../../data}:/data
    restart: unless-stopped

  web:
    image: ardupilot-la/web:${TAG:-local}
    volumes:
      - ${DATA_DIR:-../../data}/results:/data/results:ro
    restart: unless-stopped
    expose:
      - "4321"

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - web
    restart: unless-stopped

volumes:
  caddy_data:
